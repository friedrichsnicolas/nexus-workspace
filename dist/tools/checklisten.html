<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#225378"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="../manifest.webmanifest"><link rel="apple-touch-icon" href="../icons/icon-180.png"><link rel="stylesheet" href="../mobile.css?v=2.1"><link rel="stylesheet" href="../navigation.css?v=2.1"><link rel="stylesheet" href="../workspace.css?v=2.1"><script defer src="../workspace-core.js?v=2.1"></script><script defer src="../navigation.js?v=2.1"></script><title>neXus | Checklisten</title><script defer src="../process-templates.js?v=2.1"></script><script defer src="../checklisten.js?v=2.1"></script><script defer src="../module-adapters.js?v=2.1"></script><script defer src="../workflow.js?v=2.1"></script><script defer src="../jspdf.umd.min.js?v=2.1"></script><script defer src="../output.js?v=2.1"></script></head><body class="workspace-body"><nav class="appnav"><a href="../index.html">← neXus Workspace</a><span>Onboarding & Offboarding</span></nav><main class="workspace-page" style="padding-top:28px" data-output-root><h1>Onboarding & Offboarding</h1><p>Aufgaben planen, Verantwortliche festlegen und Fortschritt dokumentieren. Termine werden relativ zum ersten bzw. letzten Arbeitstag vorgeschlagen und können einzeln geändert werden.</p><section class="ws-card"><div class="ws-grid"><label>Prozess<select id="processType"><option value="onboarding">Onboarding</option><option value="offboarding">Offboarding</option></select></label><label>Vorgangstitel<input id="caseTitle" placeholder="Vorgang frei benennen"></label><label><span id="anchorLabel">Erster Arbeitstag</span><input id="anchorDate" type="date"></label></div><label>Übergreifende Notiz<textarea id="caseNotes"></textarea></label></section><div id="checklistSummary" class="checklist-summary"></div><div class="ws-filters"><label>Aufgaben filtern<select id="taskFilter"><option value="">Alle Aufgaben</option><option value="open">Offen</option><option value="progress">In Bearbeitung</option><option value="done">Erledigt</option><option value="na">Entfällt</option></select></label><div class="ws-actions"><button id="addTask">+ Eigene Aufgabe</button><button id="undoTask" hidden>Entfernte Aufgabe wiederherstellen</button><button id="printChecklist">Drucken / PDF</button></div></div><div id="taskList"></div></main><script src="../register.js?v=2.1"></script></body></html>
