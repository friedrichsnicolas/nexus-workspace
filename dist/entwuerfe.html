<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#225378"><meta name="apple-mobile-web-app-capable" content="yes"><link rel="manifest" href="./manifest.webmanifest"><link rel="apple-touch-icon" href="./icons/icon-180.png"><link rel="stylesheet" href="./navigation.css?v=3.2"><link rel="stylesheet" href="./workspace.css?v=3.2"><script defer src="./workspace-core.js?v=3.2"></script><script defer src="./navigation.js?v=3.2"></script><title>neXus | Entwürfe</title><script defer src="./entwuerfe.js?v=3.2"></script><link rel="stylesheet" href="./brand.css?v=3.2"></head><body class="workspace-body"><main class="workspace-page"><h1>Entwürfe</h1><p>Ihre gespeicherten Dokumente weiterbearbeiten, duplizieren und sichern.</p><div class="ws-actions"><button class="primary" id="backupAll">Alle Vorgänge als JSON sichern</button><button id="importBackup">Sicherung importieren</button><input type="file" id="backupFile" accept=".json,application/json" hidden></div><div class="ws-filters"><label>Suche<input id="searchDraft" placeholder="Titel suchen"></label><label>Werkzeug<select id="filterType"><option value="">Alle</option><option value="zeugnis">Zeugnis</option><option value="bewertung">Bewertungsbogen</option><option value="exit">Exitgespräch</option><option value="protokoll">Übergabe & Rückgabe</option></select></label><label><span>Papierkorb anzeigen</span><input id="showTrash" type="checkbox" style="width:24px"></label></div><p id="draftCount"></p><p id="managerStatus" role="status"></p><div id="draftsList" class="draft-list"></div><p>Entfernte Entwürfe bleiben im Papierkorb und können wiederhergestellt werden. Regelmäßig eine Sicherung herunterladen; das Löschen von Browserdaten kann lokale Vorgänge entfernen.</p></main><script src="./register.js?v=3.2"></script></body></html>
